<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First breath done</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  .content { justify-content: center; align-items: center; text-align: center; }
  .chips { justify-content: center; }
  .bloom { position: relative; width: 112px; height: 112px; margin: 0 0 var(--space-8); }
  .bloom i { position: absolute; inset: 0; border-radius: var(--radius-full); }
  .bloom .halo { background: var(--color-sun); opacity: 0.14; transform: scale(1.7); }
  .bloom .halo2 { background: var(--color-sun); opacity: 0.22; transform: scale(1.32); }
  .bloom .disc { background: radial-gradient(circle at 50% 38%, var(--color-sun-soft), var(--color-sun) 70%); }
  .bloom svg { position: absolute; inset: 28px; width: 56px; height: 56px; fill: none; stroke: var(--color-night); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .feel { margin: var(--space-8) 0 var(--space-3); font-weight: 600; }
  .week { align-self: stretch; display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-8); padding-top: var(--space-5); border-top: 1px solid var(--color-night-2); font-size: var(--text-sm); color: var(--color-night-muted); }
  .week b { color: var(--color-night-text); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .bloom .disc { animation: pop 500ms var(--ease-out) both; }
    .bloom .halo2 { animation: ring 900ms var(--ease-out) 150ms both; }
    .bloom .halo { animation: ring2 1000ms var(--ease-out) 200ms both; }
    .bloom path { stroke-dasharray: 40; animation: draw 450ms var(--ease-out) 350ms both; }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } }
    @keyframes ring { from { transform: scale(0.8); opacity: 0.5; } }
    @keyframes ring2 { from { transform: scale(0.8); opacity: 0.4; } }
    @keyframes draw { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
  }
</style>
</head>
<body>
<main class="screen night">
  <div class="statusbar"><span>21:08</span><svg width="70" height="13" viewBox="0 0 70 13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="8.5" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6.5" rx="1"/><rect x="10" y="3.5" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11.5" rx="1"/><circle cx="29" cy="11" r="1.6"/><rect x="44.5" y="3.5" width="19" height="7" rx="1.6"/></g><g fill="none" stroke="currentColor"><path d="M23.6 5.6a8 8 0 0 1 10.8 0M25.9 8.3a4.6 4.6 0 0 1 6.2 0" stroke-width="1.8" stroke-linecap="round"/><rect x="42.5" y="1.5" width="23" height="11" rx="3.2" opacity=".4"/></g><rect x="67" y="5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></svg></div>
  <section class="content">
    <div class="bloom" aria-hidden="true"><i class="halo"></i><i class="halo2"></i><i class="disc"></i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 class="display">That was one minute of Still</h1>
    <p class="lede">You just did the hardest part: starting.</p>
    <p class="feel">How do you feel compared to a minute ago?</p>
    <div class="chips">
      <span class="chip">More tense</span>
      <span class="chip">About the same</span>
      <span class="chip is-selected">A bit calmer</span>
      <span class="chip">Much calmer</span>
    </div>
    <div class="week"><span><b>Day 1 of 7</b> · Calm Start</span><span class="dots"><i class="is-done"></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
  </section>
  <footer class="actions">
    <button class="btn" data-adl-anchor="continue" data-adl-go="S9">Continue</button>
  </footer>
</main>
</body>
</html>
