<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building the plan (loading)</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  .content { justify-content: center; gap: var(--space-10); }
  .sun { position: relative; width: 140px; height: 140px; margin: 0 auto; }
  .sun i { position: absolute; inset: 0; border-radius: var(--radius-full); }
  .sun .glow { background: var(--color-sun-soft); opacity: 0.55; }
  .sun .core { inset: 30px; background: var(--color-sun); }
  .title { text-align: center; }
  .steps { display: grid; gap: var(--space-4); margin: 0 auto; padding: 0; list-style: none; width: 280px; }
  .steps li { display: flex; align-items: center; gap: var(--space-3); }
  .mark { position: relative; width: 24px; height: 24px; flex: none; border-radius: var(--radius-full); }
  .done .mark { background: var(--color-accent); }
  .done .mark::after { content: ""; position: absolute; left: 8.5px; top: 5px; width: 5px; height: 10px; border: solid var(--color-accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .busy .mark { box-shadow: inset 0 0 0 2px var(--color-surface-2); }
  .busy .mark::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid transparent; border-top-color: var(--color-accent); }
  .busy span:last-child { color: var(--color-muted); }
  @media (prefers-reduced-motion: no-preference) {
    .sun .glow { animation: glow 2.4s var(--ease-breath) infinite alternate; }
    @keyframes glow { from { transform: scale(0.82); } to { transform: scale(1); } }
    .steps li { animation: still-rise var(--dur-med) var(--ease-out) both; }
    .steps li:nth-child(2) { animation-delay: 400ms; }
    .steps li:nth-child(3) { animation-delay: 800ms; }
    .busy .mark::after { animation: spin 900ms linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>
<main class="screen">
  <div class="statusbar"><span>21:05</span><svg width="70" height="13" viewBox="0 0 70 13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="8.5" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6.5" rx="1"/><rect x="10" y="3.5" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11.5" rx="1"/><circle cx="29" cy="11" r="1.6"/><rect x="44.5" y="3.5" width="19" height="7" rx="1.6"/></g><g fill="none" stroke="currentColor"><path d="M23.6 5.6a8 8 0 0 1 10.8 0M25.9 8.3a4.6 4.6 0 0 1 6.2 0" stroke-width="1.8" stroke-linecap="round"/><rect x="42.5" y="1.5" width="23" height="11" rx="3.2" opacity=".4"/></g><rect x="67" y="5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></svg></div>
  <section class="content">
    <div class="sun" aria-hidden="true"><i class="glow"></i><i class="core"></i></div>
    <h1 class="title">Shaping your first week…</h1>
    <ul class="steps">
      <li class="done"><span class="mark"></span><span>Sessions for sleep and stress</span></li>
      <li class="done"><span class="mark"></span><span>5 minutes a day</span></li>
      <li class="busy"><span class="mark"></span><span>Gentle guidance for beginners</span></li>
    </ul>
  </section>
</main>
</body>
</html>
