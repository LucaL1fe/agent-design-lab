      <div class="option"><span class="o-text"><span class="o-title">Yes, I practise regularly</span><span class="o-sub">Less talking, more silence.</span></span><span class="o-radio"></span></div>
    </div>
  </section>
  <footer class="actions">
    <button class="btn" data-adl-anchor="continue" data-adl-go="S4">Continue</button>
  </footer>
