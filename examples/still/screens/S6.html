<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your plan</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/components.css">
<style>
  .head { padding: var(--space-6) 0 var(--space-4); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-5); }
  .plan { padding: 0 var(--space-4); }
  .row { min-height: 60px; }
  .row.next .row-title { color: var(--color-accent); }
  .more { position: relative; margin: 0; padding: var(--space-3) 0 var(--space-4) 44px; font-size: var(--text-sm); color: var(--color-muted); }
</style>
</head>
<body>
<main class="screen">
  <div class="statusbar"><span>21:06</span><svg width="70" height="13" viewBox="0 0 70 13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="8.5" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6.5" rx="1"/><rect x="10" y="3.5" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="11.5" rx="1"/><circle cx="29" cy="11" r="1.6"/><rect x="44.5" y="3.5" width="19" height="7" rx="1.6"/></g><g fill="none" stroke="currentColor"><path d="M23.6 5.6a8 8 0 0 1 10.8 0M25.9 8.3a4.6 4.6 0 0 1 6.2 0" stroke-width="1.8" stroke-linecap="round"/><rect x="42.5" y="1.5" width="23" height="11" rx="3.2" opacity=".4"/></g><rect x="67" y="5" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></svg></div>
  <section class="content">
    <div class="head rise">
      <p class="eyebrow">Your plan is ready</p>
      <h1 class="title" style="margin-top:var(--space-2)">Calm Start, your first week</h1>
    </div>
    <div class="tags"><span class="badge quiet">Sleep</span><span class="badge quiet">Stress</span><span class="badge quiet">5 min a day</span><span class="badge quiet">New to meditation</span></div>
    <div class="card plan rise">
      <div class="row next"><span class="num is-next">1</span><span class="row-text"><span class="row-title">Arrive: one minute of breath</span><span class="row-sub">Start here, right now</span></span><span class="row-meta">1 min</span></div>
      <div class="row"><span class="num">2</span><span class="row-text"><span class="row-title">Breathing out stress</span></span><span class="row-meta">5 min</span></div>
      <div class="row"><span class="num">3</span><span class="row-text"><span class="row-title">A body scan for bedtime</span></span><span class="row-meta">5 min</span></div>
      <div class="row"><span class="num">4</span><span class="row-text"><span class="row-title">Noticing busy thoughts</span></span><span class="row-meta">5 min</span></div>
      <div class="row"><span class="num">5</span><span class="row-text"><span class="row-title">Letting the day go</span></span><span class="row-meta">5 min</span></div>
      <p class="more">Days 6 and 7 open as you go</p>
    </div>
  </section>
  <footer class="actions">
    <button class="btn" data-adl-anchor="try" data-adl-go="S7">Try the first minute now</button>
    <button class="btn btn-ghost" data-adl-anchor="later" data-adl-go="S9">I’ll do it later</button>
  </footer>
</main>
</body>
</html>
